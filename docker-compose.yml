#=============================================#
# Services
#=============================================#
services:
  # SonarQube Server
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    networks:
      - devSecOps_network

  # SonarQube Database
  db:
    image: postgres:17
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - devSecOps_network

  # Jenkins
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: jenkins-custom:latest
    container_name: jenkins-server
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Asia/Kolkata
      JAVA_OPTS: "-Xms128m -Xmx512m"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /data/docker/jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - devSecOps_network

  # Trivy Security Scanner
  # trivy:
  #   image: aquasec/trivy:latest
  #   container_name: trivy-scanner
  #   profiles:
  #     - tools
  #   entrypoint: ["trivy"]
  #   volumes:
  #     - ./:/workspace:ro
  #     - /data/docker/trivy/cache:/root/.cache/
  #   networks:
  #     - devSecOps_network

#=============================================#
# Volumes
#=============================================#
volumes:
  sonarqube_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/sonarqube/sonarqube_data

  sonarqube_extensions:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/sonarqube/extensions

  sonarqube_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/sonarqube/logs

  sonarqube_temp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/sonarqube/temp

  postgresql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/sonarqube/postgres

#=============================================#
# Networks
#=============================================#
networks:
  devSecOps_network:
    driver: bridge
